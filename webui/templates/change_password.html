{% extends "base.html" %}
{% block title %}{{ t('password.title') }} – ScreenGuard{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header">{{ t('password.title') }}</div>
      <div class="card-body">
        {% if forced %}
        <p class="text-secondary mb-3" style="font-size:13px">{{ t('password.forced_hint') }}</p>
        {% endif %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label small fw-medium">{{ t('users.label_password') if forced else t('password.label_current') }}</label>
            <input type="password" name="current_password" class="form-control" required autocomplete="current-password" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium">{{ t('password.label_new') }}</label>
            <input type="password" name="new_password" class="form-control" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium">{{ t('password.label_confirm') }}</label>
            <input type="password" name="confirm_password" class="form-control" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary">{{ t('password.btn_save') }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
